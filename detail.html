<head><script>window.APP_DATA = [{"id":"1","title":"静夜思","author":"李白","dynasty":"唐","theme":"思乡","content":"床前明月光，疑是地上霜。举头望明月，低头思故乡。","pinyin":"Chuáng qián míng yuè guāng, yí shì dì shàng shuāng. Jǔ tóu wàng míng yuè, dī tóu sī gù xiāng.","note":"全诗四句，语言简练，情感真挚。","appreciation":"通过明月映照的光辉，寄托了诗人对故乡的深切思念。","background":"李白在旅途中夜宿异乡，望月而起，思念家乡。","image":"images/jingyesi.jpg"},{"id":"2","title":"春晓","author":"孟浩然","dynasty":"唐","theme":"春景","content":"春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。","pinyin":"Chūn mián bù jué xiǎo, chù chù wén tí niǎo. Yè lái fēng yǔ shēng, huā luò zhī duō shǎo.","note":"描写春晨的宁静与生机。","appreciation":"以睡意与鸟鸣对比，突显春天的活力与短暂。","background":"孟浩然隐居山林，春晨醒来感受自然之美。","image":"images/chunxiao.jpg"},{"id":"3","title":"黄鹤楼送孟浩然","author":"李白","dynasty":"唐","theme":"送别","content":"故人西辞黄鹤楼，烟花三月下扬州。孤帆远影碧天尽，惟见长江天际流。","pinyin":"Gù rén xī cí Huánghè lóu, yānhuā sān yuè xià Yángzhōu. Gū fān yuǎn yǐng bì tiān jìn, wéi jiàn Chángjiāng tiān jì liú.","note":"写别情与江水浩渺。","appreciation":"以黄鹤楼为起点，借江水的绵长表达离别之情。","background":"李白送友人孟浩然前往扬州，作此送别之作。","image":"images/huanghelou.jpg"},{"id":"4","title":"枫桥夜泊","author":"张继","dynasty":"唐","theme":"夜泊","content":"月落乌啼霜满天，江枫渔火对愁眠。姑苏城外寒山寺，夜半钟声到客船。","pinyin":"Yuè luò wū tí shuāng mǎn tiān, jiāng fēng yú huǒ duì chóu mián. Gūsū chéng wài Hánshān sì, yè bàn zhōng shēng dào kè chuán.","note":"以寒山寺钟声烘托离愁。","appreciation":"月色、乌啼、渔火、钟声交织，营造凄凉的夜泊意境。","background":"张继夜泊枫桥，听闻寒山寺钟声而作。","image":"images/fengqiaoyebo.jpg"},{"id":"5","title":"登鹳雀楼","author":"王之涣","dynasty":"唐","theme":"壮阔","content":"白日依山尽，黄河入海流。欲穷千里目，更上一层楼。","pinyin":"Bái rì yī shān jìn, Huánghé rù hǎi liú. Yù qióng qiān lǐ mù, gèng shàng yī céng lóu.","note":"四句描绘宏大景观。","appreciation":"以层层递进的视角，表达胸怀的开阔。","background":"王之涣登楼远眺，感慨天地之大。","image":"images/dengguanque.jpg"},{"id":"6","title":"江雪","author":"柳宗元","dynasty":"唐","theme":"孤寂","content":"千山鸟飞绝，万径人踪灭。孤舟蓑笠翁，独钓寒江雪。","pinyin":"Qiān shān niǎo fēi jué, wàn jìng rén zōng miè. Gū zhōu suō lì wēng, dú diào hán jiāng xuě.","note":"以极致的寂静表现诗人隐居情怀。","appreciation":"全诗以“绝”“灭”“孤”“独”四字构筑空灵意境。","background":"柳宗元被贬永州，写下此图景以抒怀。","image":"images/jiangxue.jpg"},{"id":"7","title":"相思","author":"王维","dynasty":"唐","theme":"相思","content":"红豆生南国，春来发几枝。愿君多采撷，此物最相思。","pinyin":"Hóng dòu shēng nán guó, chūn lái fā jǐ zhī. Yuàn jūn duō cǎi qiè, cǐ wù zuì xiāng sī.","note":"红豆象征相思之情。","appreciation":"语言朴素，却蕴含深厚情感，成为千古相思名句。","background":"王维在送别友人时作，以红豆寄托思念。","image":"images/xiangsi.jpg"},{"id":"8","title":"夜泊牛渚怀古","author":"杜甫","dynasty":"唐","theme":"怀古","content":"牛渚西江夜，青天无片云。登舟望秋月，空忆谢将军。","pinyin":"Niú zhǔ xī jiāng yè, qīng tiān wú piàn yún. Dēng zhōu wàng qiū yuè, kōng yì Xiè jiāng jūn.","note":"借古抒今，感叹时世变迁。","appreciation":"以清朗的夜色映衬对谢安的追忆，情景交融。","background":"杜甫在长江上夜泊，凭吊三国时期的谢安。","image":"images/niuzhu.jpg"}];</script>
<meta charset="UTF-8">

<style>
:root{
    --primary:#2f6fed;
    --secondary:#f5a623;
    --font-family:"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
    font-family:var(--font-family);
    background:#f0f2f5;
    color:#333;
    line-height:1.5;
    padding-top:64px;/* header height */
}
a{color:inherit;text-decoration:none;}
header{
    position:fixed;top:0;left:0;right:0;height:56px;
    background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;z-index:1000;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}
header .logo{font-size:1.2rem;font-weight:bold;}
header .nav-links a{
    margin-left:12px;color:#fff;font-size:.9rem;
}
.container{
    max-width:1200px;margin:auto;padding:16px;
}
.card{
    background:#fff;border-radius:8px;padding:12px;margin-bottom:16px;
    box-shadow:0 2px 4px rgba(0,0,0,.1);
}
.card img{
    width:100%;border-radius:8px;height:auto;max-height:300px;object-fit:cover;
}
.title{
    font-size:1.6rem;color:var(--secondary);margin:12px 0 8px;
}
.meta{
    color:#666;font-size:.9rem;margin-bottom:12px;
}
.section{
    margin-top:16px;
}
.section h3{
    font-size:1.2rem;color:var(--primary);margin-bottom:8px;
}
.btn{
    display:inline-block;background:var(--primary);color:#fff;
    padding:8px 16px;border:none;border-radius:4px;
    cursor:pointer;transition:all .2s;
    margin-right:8px;
}
.btn:hover{box-shadow:0 4px 8px rgba(0,0,0,.2);}
.btn:active{transform:scale(0.98);}
.footer-nav{
    margin-top:24px;
}
@media(min-width:600px){
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
}
@media(min-width:900px){
    .grid{grid-template-columns:repeat(3,1fr);}
}
</style>

<body>
<header>
    <div class="logo">中华古诗词赏析平台</div>
    <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="list.html">诗词列表</a>
        <a href="about.html">关于</a>
        <a href="contact.html">联系</a>
    </div>
</header>

<div class="container">
    <div id="detailCard" class="card"></div>

    <div class="footer-nav">
        <button id="prevBtn" class="btn">上一首</button>
        <button id="nextBtn" class="btn">下一首</button>
        <button id="backBtn" class="btn">返回列表</button>
    </div>
</div>

<script>
// APP_DATA 已在全局注入
(function(){
    const params = new URLSearchParams(location.search);
    const poemId = params.get('id');
    const poems = window.APP_DATA?.poems || [];
    const index = poems.findIndex(p=>p.id===poemId);
    if(index===-1){
        document.getElementById('detailCard').innerHTML='<p>未找到对应诗词。</p>';
        return;
    }
    const poem = poems[index];

    // 构建详情卡片
    const card = document.getElementById('detailCard');
    card.innerHTML = `
        <img src="${poem.image}" alt="${poem.title}">
        <div class="title">${poem.title}</div>
        <div class="meta">作者：<a href="author.html?authorId=${encodeURIComponent(poem.author)}">${poem.author}</a>　朝代：${poem.dynasty}　主题：${poem.theme}</div>
        <div class="section"><h3>原文</h3><p>${poem.content.replace(/\\n/g,'<br>')}</p></div>
        <div class="section"><h3>拼音</h3><p>${poem.pinyin}</p></div>
        <div class="section"><h3>注释</h3><p>${poem.note}</p></div>
        <div class="section"><h3>赏析</h3><p>${poem.appreciation}</p></div>
        <div class="section"><h3>背景</h3><p>${poem.background}</p></div>
    `;

    // 上一首/下一首按钮
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    prevBtn.disabled = index===0;
    nextBtn.disabled = index===poems.length-1;
    prevBtn.onclick = ()=>{ if(index>0) location.href=`detail.html?id=${poems[index-1].id}`; };
    nextBtn.onclick = ()=>{ if(index<poems.length-1) location.href=`detail.html?id=${poems[index+1].id}`; };

    // 返回列表，保留除 id 之外的所有查询参数
    const backBtn = document.getElementById('backBtn');
    const backParams = new URLSearchParams(location.search);
    backParams.delete('id');
    backBtn.onclick = ()=>{ location.href='list.html'+(backParams.toString()?'?'+backParams.toString():''); };
})();
</script>
</body>
</html>
