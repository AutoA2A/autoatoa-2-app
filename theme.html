<head><script>window.APP_DATA = [{"id":"1","title":"静夜思","author":"李白","dynasty":"唐","theme":"思乡","content":"床前明月光，疑是地上霜。举头望明月，低头思故乡。","pinyin":"Chuáng qián míng yuè guāng, yí shì dì shàng shuāng. Jǔ tóu wàng míng yuè, dī tóu sī gù xiāng.","note":"全诗四句，语言简练，情感真挚。","appreciation":"通过明月映照的光辉，寄托了诗人对故乡的深切思念。","background":"李白在旅途中夜宿异乡，望月而起，思念家乡。","image":"images/jingyesi.jpg"},{"id":"2","title":"春晓","author":"孟浩然","dynasty":"唐","theme":"春景","content":"春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。","pinyin":"Chūn mián bù jué xiǎo, chù chù wén tí niǎo. Yè lái fēng yǔ shēng, huā luò zhī duō shǎo.","note":"描写春晨的宁静与生机。","appreciation":"以睡意与鸟鸣对比，突显春天的活力与短暂。","background":"孟浩然隐居山林，春晨醒来感受自然之美。","image":"images/chunxiao.jpg"},{"id":"3","title":"黄鹤楼送孟浩然","author":"李白","dynasty":"唐","theme":"送别","content":"故人西辞黄鹤楼，烟花三月下扬州。孤帆远影碧天尽，惟见长江天际流。","pinyin":"Gù rén xī cí Huánghè lóu, yānhuā sān yuè xià Yángzhōu. Gū fān yuǎn yǐng bì tiān jìn, wéi jiàn Chángjiāng tiān jì liú.","note":"写别情与江水浩渺。","appreciation":"以黄鹤楼为起点，借江水的绵长表达离别之情。","background":"李白送友人孟浩然前往扬州，作此送别之作。","image":"images/huanghelou.jpg"},{"id":"4","title":"枫桥夜泊","author":"张继","dynasty":"唐","theme":"夜泊","content":"月落乌啼霜满天，江枫渔火对愁眠。姑苏城外寒山寺，夜半钟声到客船。","pinyin":"Yuè luò wū tí shuāng mǎn tiān, jiāng fēng yú huǒ duì chóu mián. Gūsū chéng wài Hánshān sì, yè bàn zhōng shēng dào kè chuán.","note":"以寒山寺钟声烘托离愁。","appreciation":"月色、乌啼、渔火、钟声交织，营造凄凉的夜泊意境。","background":"张继夜泊枫桥，听闻寒山寺钟声而作。","image":"images/fengqiaoyebo.jpg"},{"id":"5","title":"登鹳雀楼","author":"王之涣","dynasty":"唐","theme":"壮阔","content":"白日依山尽，黄河入海流。欲穷千里目，更上一层楼。","pinyin":"Bái rì yī shān jìn, Huánghé rù hǎi liú. Yù qióng qiān lǐ mù, gèng shàng yī céng lóu.","note":"四句描绘宏大景观。","appreciation":"以层层递进的视角，表达胸怀的开阔。","background":"王之涣登楼远眺，感慨天地之大。","image":"images/dengguanque.jpg"},{"id":"6","title":"江雪","author":"柳宗元","dynasty":"唐","theme":"孤寂","content":"千山鸟飞绝，万径人踪灭。孤舟蓑笠翁，独钓寒江雪。","pinyin":"Qiān shān niǎo fēi jué, wàn jìng rén zōng miè. Gū zhōu suō lì wēng, dú diào hán jiāng xuě.","note":"以极致的寂静表现诗人隐居情怀。","appreciation":"全诗以“绝”“灭”“孤”“独”四字构筑空灵意境。","background":"柳宗元被贬永州，写下此图景以抒怀。","image":"images/jiangxue.jpg"},{"id":"7","title":"相思","author":"王维","dynasty":"唐","theme":"相思","content":"红豆生南国，春来发几枝。愿君多采撷，此物最相思。","pinyin":"Hóng dòu shēng nán guó, chūn lái fā jǐ zhī. Yuàn jūn duō cǎi qiè, cǐ wù zuì xiāng sī.","note":"红豆象征相思之情。","appreciation":"语言朴素，却蕴含深厚情感，成为千古相思名句。","background":"王维在送别友人时作，以红豆寄托思念。","image":"images/xiangsi.jpg"},{"id":"8","title":"夜泊牛渚怀古","author":"杜甫","dynasty":"唐","theme":"怀古","content":"牛渚西江夜，青天无片云。登舟望秋月，空忆谢将军。","pinyin":"Niú zhǔ xī jiāng yè, qīng tiān wú piàn yún. Dēng zhōu wàng qiū yuè, kōng yì Xiè jiāng jūn.","note":"借古抒今，感叹时世变迁。","appreciation":"以清朗的夜色映衬对谢安的追忆，情景交融。","background":"杜甫在长江上夜泊，凭吊三国时期的谢安。","image":"images/niuzhu.jpg"}];</script>
<meta charset="UTF-8">
<title>主题专页</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
    --primary:#2f6fed;
    --secondary:#f5a623;
    --font-family:"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
    font-family:var(--font-family);
    background:#f0f2f5;
    color:#333;
    line-height:1.6;
    padding-top:64px;
}
a{color:inherit;text-decoration:none;}
header{
    position:fixed;top:0;left:0;right:0;height:56px;
    background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;z-index:1000;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}
header .logo{
    font-size:1.1rem;
    font-weight:bold;
    white-space:nowrap;
}
header .search-box{
    flex:1;
    max-width:400px;
    margin:0 16px;
    display:flex;
}
header .search-box input{
    flex:1;
    padding:8px 12px;
    border:none;
    border-radius:4px;
    font-size:0.9rem;
    outline:none;
}
header .search-box button{
    padding:8px 16px;
    margin-left:8px;
    background:#f5a623;
    color:#fff;
    border:none;
    border-radius:4px;
    cursor:pointer;
    font-size:0.9rem;
    transition:background 0.2s;
}
header .search-box button:hover{
    background:#e09512;
}
header nav{
    display:flex;
    gap:8px;
}
header nav a{
    padding:6px 12px;
    border-radius:4px;
    font-size:0.85rem;
    transition:background 0.2s;
    white-space:nowrap;
}
header nav a:hover{
    background:rgba(255,255,255,.15);
}
.container{
    max-width:1200px;
    margin:0 auto;
    padding:24px 16px;
}
.page-title{
    font-size:1.8rem;
    color:var(--secondary);
    margin-bottom:24px;
    padding-bottom:12px;
    border-bottom:2px solid var(--secondary);
}
.theme-badge{
    display:inline-block;
    background:var(--primary);
    color:#fff;
    padding:4px 12px;
    border-radius:4px;
    font-size:0.8rem;
    margin-bottom:8px;
}
.poem-grid{
    display:grid;
    grid-template-columns:repeat(1,1fr);
    gap:16px;
}
@media(min-width:600px){
    .poem-grid{
        grid-template-columns:repeat(2,1fr);
    }
}
@media(min-width:900px){
    .poem-grid{
        grid-template-columns:repeat(3,1fr);
    }
}
.poem-card{
    background:#fff;
    border-radius:8px;
    padding:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    transition:transform 0.2s,box-shadow 0.2s;
    cursor:pointer;
}
.poem-card:hover{
    transform:translateY(-4px);
    box-shadow:0 4px 16px rgba(0,0,0,.12);
}
.poem-card-title{
    font-size:1.2rem;
    color:var(--secondary);
    margin-bottom:8px;
}
.poem-card-meta{
    font-size:0.85rem;
    color:#666;
    margin-bottom:12px;
}
.poem-card-content{
    font-size:0.95rem;
    color:#444;
    line-height:1.8;
    padding:12px;
    background:#f8f9fa;
    border-radius:6px;
    margin-bottom:12px;
}
.poem-card-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.poem-card-tag{
    display:inline-block;
    padding:4px 10px;
    background:var(--primary);
    color:#fff;
    border-radius:4px;
    font-size:0.75rem;
}
.poem-card-author{
    font-size:0.85rem;
    color:#888;
}
.empty-state{
    text-align:center;
    padding:60px 20px;
    color:#666;
}
.empty-state-icon{
    font-size:3rem;
    margin-bottom:16px;
}
.empty-state-text{
    font-size:1.1rem;
    margin-bottom:8px;
}
.empty-state-hint{
    font-size:0.9rem;
    color:#999;
}
.btn-back{
    display:inline-block;
    margin-bottom:24px;
    padding:10px 20px;
    background:var(--primary);
    color:#fff;
    border-radius:4px;
    font-size:0.9rem;
    transition:background 0.2s;
}
.btn-back:hover{
    background:#2563cc;
}
</style>
<meta name="description" content="读取 ?theme= 参数，展示该主题下的诗词卡片列表。点击卡片跳转至 detail.html?id=poemId。"><meta name="keywords" content="古诗词,中华文化,诗词解析,古代文学,诗词搜索,朝代筛选,作者作品,主题赏析"><meta name="robots" content="index,follow,max-image-preview:large"><meta property="og:type" content="website"><meta property="og:title" content="主题专页"><meta property="og:description" content="读取 ?theme= 参数，展示该主题下的诗词卡片列表。点击卡片跳转至 detail.html?id=poemId。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="主题专页"><meta name="twitter:description" content="读取 ?theme= 参数，展示该主题下的诗词卡片列表。点击卡片跳转至 detail.html?id=poemId。"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"主题专页","description":"读取 ?theme= 参数，展示该主题下的诗词卡片列表。点击卡片跳转至 detail.html?id=poemId。","applicationCategory":"UtilitiesApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"CNY"}}</script></head>
<body>
<header>
    <a href="index.html" class="logo">📜 中华古诗词赏析平台</a>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索诗词、作者...">
        <button onclick="goSearch()">搜索</button>
    </div>
    <nav>
        <a href="list.html">诗词列表</a>
        <a href="list.html?dynasty=唐">朝代</a>
        <a href="author.html">作者</a>
        <a href="about.html">关于</a>
    </nav>
</header>

<div class="container">
    <a href="list.html" class="btn-back">← 返回诗词列表</a>
    <h1 class="page-title" id="pageTitle">主题专页</h1>
    <div class="poem-grid" id="poemGrid"></div>
</div>

<script>
(function(){
    // 获取URL参数
    const urlParams = new URLSearchParams(location.search);
    const theme = urlParams.get('theme') || '';

    // 更新页面标题
    const pageTitle = document.getElementById('pageTitle');
    if(theme){
        pageTitle.textContent = '主题：「' + theme + '」';
    }else{
        pageTitle.textContent = '主题专页';
    }

    // 筛选该主题的诗词
    const poems = window.APP_DATA && window.APP_DATA.poems ? window.APP_DATA.poems : [];
    const filteredPoems = theme 
        ? poems.filter(p => p.theme === theme) 
        : poems;

    // 渲染诗词卡片
    const poemGrid = document.getElementById('poemGrid');
    
    if(filteredPoems.length === 0){
        poemGrid.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1;">
                <div class="empty-state-icon">📖</div>
                <div class="empty-state-text">暂无「${theme}」主题的诗词</div>
                <div class="empty-state-hint">试试其他主题，或返回诗词列表浏览全部</div>
            </div>
        `;
    }else{
        poemGrid.innerHTML = filteredPoems.map(poem => `
            <div class="poem-card" onclick="location.href='detail.html?id=${poem.id}'">
                <div class="poem-card-title">${poem.title}</div>
                <div class="poem-card-meta">${poem.dynasty} · ${poem.author}</div>
                <div class="poem-card-content">${poem.content.substring(0,30)}${poem.content.length > 30 ? '...' : ''}</div>
                <div class="poem-card-footer">
                    <span class="poem-card-tag">${poem.theme}</span>
                    <span class="poem-card-author">查看详情 →</span>
                </div>
            </div>
        `).join('');
    }

    // 搜索功能
    function goSearch(){
        const q = document.getElementById('searchInput').value.trim();
        if(q){
            location.href = 'search.html?q=' + encodeURIComponent(q);
        }
    }

    // 回车搜索
    document.getElementById('searchInput').addEventListener('keypress',function(e){
        if(e.key === 'Enter'){
            goSearch();
        }
    });

    // 暴露goSearch到全局
    window.goSearch = goSearch;
})();
</script>
</body>
</html>
