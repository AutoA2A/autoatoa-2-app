<head><script>window.APP_DATA = [{"id":"1","title":"静夜思","author":"李白","dynasty":"唐","theme":"思乡","content":"床前明月光，疑是地上霜。举头望明月，低头思故乡。","pinyin":"Chuáng qián míng yuè guāng, yí shì dì shàng shuāng. Jǔ tóu wàng míng yuè, dī tóu sī gù xiāng.","note":"全诗四句，语言简练，情感真挚。","appreciation":"通过明月映照的光辉，寄托了诗人对故乡的深切思念。","background":"李白在旅途中夜宿异乡，望月而起，思念家乡。","image":"images/jingyesi.jpg"},{"id":"2","title":"春晓","author":"孟浩然","dynasty":"唐","theme":"春景","content":"春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。","pinyin":"Chūn mián bù jué xiǎo, chù chù wén tí niǎo. Yè lái fēng yǔ shēng, huā luò zhī duō shǎo.","note":"描写春晨的宁静与生机。","appreciation":"以睡意与鸟鸣对比，突显春天的活力与短暂。","background":"孟浩然隐居山林，春晨醒来感受自然之美。","image":"images/chunxiao.jpg"},{"id":"3","title":"黄鹤楼送孟浩然","author":"李白","dynasty":"唐","theme":"送别","content":"故人西辞黄鹤楼，烟花三月下扬州。孤帆远影碧天尽，惟见长江天际流。","pinyin":"Gù rén xī cí Huánghè lóu, yānhuā sān yuè xià Yángzhōu. Gū fān yuǎn yǐng bì tiān jìn, wéi jiàn Chángjiāng tiān jì liú.","note":"写别情与江水浩渺。","appreciation":"以黄鹤楼为起点，借江水的绵长表达离别之情。","background":"李白送友人孟浩然前往扬州，作此送别之作。","image":"images/huanghelou.jpg"},{"id":"4","title":"枫桥夜泊","author":"张继","dynasty":"唐","theme":"夜泊","content":"月落乌啼霜满天，江枫渔火对愁眠。姑苏城外寒山寺，夜半钟声到客船。","pinyin":"Yuè luò wū tí shuāng mǎn tiān, jiāng fēng yú huǒ duì chóu mián. Gūsū chéng wài Hánshān sì, yè bàn zhōng shēng dào kè chuán.","note":"以寒山寺钟声烘托离愁。","appreciation":"月色、乌啼、渔火、钟声交织，营造凄凉的夜泊意境。","background":"张继夜泊枫桥，听闻寒山寺钟声而作。","image":"images/fengqiaoyebo.jpg"},{"id":"5","title":"登鹳雀楼","author":"王之涣","dynasty":"唐","theme":"壮阔","content":"白日依山尽，黄河入海流。欲穷千里目，更上一层楼。","pinyin":"Bái rì yī shān jìn, Huánghé rù hǎi liú. Yù qióng qiān lǐ mù, gèng shàng yī céng lóu.","note":"四句描绘宏大景观。","appreciation":"以层层递进的视角，表达胸怀的开阔。","background":"王之涣登楼远眺，感慨天地之大。","image":"images/dengguanque.jpg"},{"id":"6","title":"江雪","author":"柳宗元","dynasty":"唐","theme":"孤寂","content":"千山鸟飞绝，万径人踪灭。孤舟蓑笠翁，独钓寒江雪。","pinyin":"Qiān shān niǎo fēi jué, wàn jìng rén zōng miè. Gū zhōu suō lì wēng, dú diào hán jiāng xuě.","note":"以极致的寂静表现诗人隐居情怀。","appreciation":"全诗以“绝”“灭”“孤”“独”四字构筑空灵意境。","background":"柳宗元被贬永州，写下此图景以抒怀。","image":"images/jiangxue.jpg"},{"id":"7","title":"相思","author":"王维","dynasty":"唐","theme":"相思","content":"红豆生南国，春来发几枝。愿君多采撷，此物最相思。","pinyin":"Hóng dòu shēng nán guó, chūn lái fā jǐ zhī. Yuàn jūn duō cǎi qiè, cǐ wù zuì xiāng sī.","note":"红豆象征相思之情。","appreciation":"语言朴素，却蕴含深厚情感，成为千古相思名句。","background":"王维在送别友人时作，以红豆寄托思念。","image":"images/xiangsi.jpg"},{"id":"8","title":"夜泊牛渚怀古","author":"杜甫","dynasty":"唐","theme":"怀古","content":"牛渚西江夜，青天无片云。登舟望秋月，空忆谢将军。","pinyin":"Niú zhǔ xī jiāng yè, qīng tiān wú piàn yún. Dēng zhōu wàng qiū yuè, kōng yì Xiè jiāng jūn.","note":"借古抒今，感叹时世变迁。","appreciation":"以清朗的夜色映衬对谢安的追忆，情景交融。","background":"杜甫在长江上夜泊，凭吊三国时期的谢安。","image":"images/niuzhu.jpg"}];</script>
<meta charset="UTF-8">
<title>中华古诗词赏析平台</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
    --primary:#2f6fed;
    --secondary:#f5a623;
    --font-family:"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
    font-family:var(--font-family);
    background:#f0f2f5;
    color:#333;
    line-height:1.5;
}
a{color:inherit;text-decoration:none;}
header{
    position:fixed;top:0;left:0;right:0;
    background:var(--primary);
    color:#fff;
    display:flex;align-items:center;
    padding:8px 16px;
    z-index:1000;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}
header .logo{
    font-size:1.2rem;
    font-weight:bold;
    margin-right:auto;
}
header .search-box{
    flex:1;
    max-width:300px;
    margin:0 12px;
}
header .search-box input{
    width:100%;
    padding:6px 10px;
    border:none;
    border-radius:4px;
}
header .nav-links a{
    margin-left:12px;
    font-size:0.9rem;
}
main{padding:80px 16px 16px;}
.carousel{
    position:relative;
    overflow:hidden;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    margin-bottom:16px;
}
.carousel img{
    width:100%;
    display:block;
    height:200px;
    object-fit:cover;
}
.carousel .caption{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    background:rgba(0,0,0,.5);
    color:#fff;
    padding:8px 12px;
    font-size:1rem;
}
.carousel .dots{
    position:absolute;
    bottom:8px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
}
.carousel .dot{
    width:8px;height:8px;
    background:#fff;
    border-radius:50%;
    margin:0 4px;
    opacity:.5;
    cursor:pointer;
    transition:opacity .2s;
}
.carousel .dot.active{opacity:1;}
.filter-section{
    display:grid;
    gap:16px;
    margin-bottom:16px;
}
@media(min-width:600px){
    .filter-section{grid-template-columns:repeat(2,1fr);}
}
@media(min-width:900px){
    .filter-section{grid-template-columns:repeat(3,1fr);}
}
.filter-card{
    background:#fff;
    border-radius:8px;
    padding:12px;
    box-shadow:0 1px 4px rgba(0,0,0,.1);
    cursor:pointer;
    transition:transform .2s,box-shadow .2s;
}
.filter-card:hover{
    transform:translateY(-2px);
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}
.filter-card h3{
    color:var(--secondary);
    margin-bottom:8px;
    font-size:1rem;
}
.filter-card p{
    font-size:0.9rem;
    color:#555;
}
button{
    background:var(--primary);
    color:#fff;
    border:none;
    border-radius:4px;
    padding:6px 12px;
    cursor:pointer;
    transition:background .2s,box-shadow .2s;
}
button:hover{
    background:#255acb;
    box-shadow:0 2px 6px rgba(0,0,0,.2);
}
</style>

<body>
<header>
    <div class="logo">古诗词赏析</div>
    <div class="search-box">
        <input type="text" id="globalSearch" placeholder="搜索诗词、作者...">
    </div>
    <div class="nav-links">
        <a href="about.html">关于</a>
        <a href="contact.html">联系</a>
    </div>
</header>

<main>
    <section class="carousel" id="carousel">
        <!-- images injected by JS -->
        <div class="dots" id="dots"></div>
    </section>

    <section class="filter-section" id="filters">
        <!-- filter cards injected by JS -->
    </section>
</main>

<script>
// Assume window.APP_DATA is already injected
(function(){
    const data = window.APP_DATA || {poems:[],authors:[]};

    // ---------- Carousel ----------
    const carouselEl = document.getElementById('carousel');
    const dotsEl = document.getElementById('dots');
    const carouselItems = data.poems.slice(0,5); // first 5 as featured
    let curIdx = 0;

    function renderCarousel(){
        carouselEl.innerHTML = '';
        const item = carouselItems[curIdx];
        const img = document.createElement('img');
        img.src = item.image || 'https://via.placeholder.com/800x200?text='+encodeURIComponent(item.title);
        img.alt = item.title;
        const caption = document.createElement('div');
        caption.className='caption';
        caption.textContent = `${item.title} — ${item.author}（${item.dynasty}）`;
        carouselEl.appendChild(img);
        carouselEl.appendChild(caption);
        // dots
        dotsEl.innerHTML='';
        carouselItems.forEach((_,i)=>{
            const dot=document.createElement('div');
            dot.className='dot'+(i===curIdx?' active':'');
            dot.addEventListener('click',()=>{curIdx=i;renderCarousel();});
            dotsEl.appendChild(dot);
        });
        // click navigation
        carouselEl.onclick=()=>{location.href=`list.html?${new URLSearchParams({dynasty:item.dynasty,author:item.author,theme:item.theme}).toString()}`;};
    }
    renderCarousel();
    setInterval(()=>{
        curIdx=(curIdx+1)%carouselItems.length;
        renderCarousel();
    },5000);

    // ---------- Filters ----------
    const filterContainer=document.getElementById('filters');
    const dynasties=[...new Set(data.poems.map(p=>p.dynasty))];
    const authors=[...new Set(data.poems.map(p=>p.author))];
    const themes=[...new Set(data.poems.map(p=>p.theme))];

    function createCard(title, label, paramName, value){
        const card=document.createElement('div');
        card.className='filter-card';
        const h=document.createElement('h3');
        h.textContent=title;
        const p=document.createElement('p');
        p.textContent=label;
        card.appendChild(h);
        card.appendChild(p);
        card.onclick=()=>{location.href=`list.html?${new URLSearchParams({[paramName]:value}).toString()}`;};
        return card;
    }

    dynasties.forEach(d=>filterContainer.appendChild(createCard('朝代', d, 'dynasty', d)));
    authors.slice(0,6).forEach(a=>filterContainer.appendChild(createCard('作者', a, 'author', a)));
    themes.slice(0,6).forEach(t=>filterContainer.appendChild(createCard('主题', t, 'theme', t)));

    // ---------- Search ----------
    const searchInput=document.getElementById('globalSearch');
    searchInput.addEventListener('keydown',e=>{
        if(e.key==='Enter' && searchInput.value.trim()){
            const q=searchInput.value.trim();
            location.href=`search.html?${new URLSearchParams({q}).toString()}`;
        }
    });
})();
</script>
</body>
</html>
